<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-center text-red-500">YouTube Downloader</h1>
        
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2" for="url">Video URL</label>
            <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." 
                class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500 text-sm">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-2" for="folder">Output Folder</label>
            <input type="text" id="folder" value="downloads" 
                class="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg focus:outline-none focus:border-red-500 text-sm">
        </div>

        <button onclick="startDownload()" id="downloadBtn"
            class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded-lg transition duration-200 cursor-pointer">
            Download Video
        </button>

        <div id="status" class="mt-4 text-center text-sm hidden p-3 rounded-lg"></div>
    </div>
</body>
</html>
